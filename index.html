<!DOCTYPE html>
<html lang="en">
	<head>
	  <meta charset="UTF-8">
	  <meta name="viewport" content="width=device-width, initial-scale=1.0">
	  <!-- <link rel="shortcut icon" href="imgs/icon-192.png" type="image/x-icon"> -->
	  <link rel="stylesheet" href="css/style.css" type="text/css">
	  <link rel="manifest" href="manifest.json">
	  <meta name="theme-color" content="#141B1F">
	  <title>ListX</title>
	  <script>/* Apply the saved theme before first paint (no flash) */
	    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
	  </script>
	</head>
	
	<body>
	  <!-- Header section with title and form for adding tasks -->
	  <header class="box">
	    <button type="button" class="theme-toggle" title="Toggle theme">
	      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
	      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
	    </button>
	    <h1>List<span>X</span>
	    </h1>
	    <form>
	      <input type="text" class="task-input" placeholder="Write a new Task.">
	      <button type="button" title="Add" class="add">+</button>
	    </form>
	  </header>
	
	  <!-- Main section with task counter and task list -->
	  <main class="box">
	    <header>
	      <p class="task-counter">You have <span class="count">0</span> tasks</p>
	      <button class="clear">Clear</button>
	    </header>
	    <ul class="task-list">
	      <!-- Placeholder text when no tasks are present -->
	      <div class="empty">
	        No tasks
	      </div>
	    </ul>
	  </main>

	  <!-- Clear-all confirmation popup -->
	  <div class="modal-overlay">
	    <div class="modal">
	      <p>Clear all tasks ?</p>
	      <div class="modal-buttons">
	        <button class="modal-yes">Yes</button>
	        <button class="modal-no">No</button>
	      </div>
	    </div>
	  </div>
	  <script src="js/app.js"></script>
	</body>
</html>
